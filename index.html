let tourI = -1;
const visEl = sel => [...document.querySelectorAll(sel)].find(e => e.getClientRects().length) || null;
function startTour() { tourI = 0; $('#tour').hidden = false; showTour(); }
function endTour() {
  $('#tour').hidden = true; tourI = -1;
  if (!S.tourDone) { S.tourDone = 1; saveS(); }
  go('home');
}
function showTour() {
  const st = TOUR[tourI];
  if (st.tab && V.tab !== st.tab) go(st.tab);
  $('#tourH').textContent = st.title; $('#tourP').textContent = st.text;
  $('#tourDots').innerHTML = TOUR.map((_, i) => `<i class="${i === tourI ? 'on' : ''}"></i>`).join('');
  $('#tourBack').style.visibility = tourI ? 'visible' : 'hidden';
  $('#tourNext').textContent = tourI === TOUR.length - 1 ? 'Готово' : 'Дальше';
  const el = st.sel && visEl(st.sel);
  if (el && !el.closest('.top,.tabs')) el.scrollIntoView({ block: 'center' });
  requestAnimationFrame(placeTour);
  $('#tourNext').focus();
}
function placeTour() {
  if (tourI < 0) return;
  const st = TOUR[tourI], el = st.sel && visEl(st.sel), spot = $('#tourSpot'), card = $('#tourCard');
  const H = innerHeight, ch = card.offsetHeight;
  if (!el) { spot.style.cssText = `left:50%;top:40%;width:0;height:0`; card.style.top = Math.max(12, (H - ch) / 2) + 'px'; return; }
  const r = el.getBoundingClientRect(), top = Math.max(6, r.top - 6), bot = Math.min(H - 6, r.bottom + 6);
  spot.style.cssText = `left:${r.left - 6}px;top:${top}px;width:${r.width + 12}px;height:${Math.max(0, bot - top)}px`;
  card.style.top = (bot + ch + 16 < H ? bot + 12 : top - ch - 12 > 0 ? top - ch - 12 : Math.max(12, H - ch - 12)) + 'px';
}
$('#tourNext').addEventListener('click', () => { if (tourI >= TOUR.length - 1) return endTour(); tourI++; showTour(); });
$('#tourBack').addEventListener('click', () => { if (tourI > 0) { tourI--; showTour(); } });
$('#tourSkip').addEventListener('click', endTour);
$('#helpBtn').addEventListener('click', startTour);
addEventListener('resize', () => requestAnimationFrame(placeTour));
addEventListener('scroll', () => requestAnimationFrame(placeTour), { passive: true });
addEventListener('keydown', e => { if (tourI >= 0 && e.key === 'Escape') endTour(); });

// своё окно подтверждения: возвращает Promise<boolean>
function ask(text, ok, danger) {
  const d = $('#cdlg');
  $('#cText').textContent = text; $('#cOk').textContent = ok || 'Да'; $('#cOk').classList.toggle('danger-btn', !!danger);
  return new Promise(res => { d.addEventListener('close', () => res(d.returnValue === 'ok'), { once: true }); d.returnValue = ''; d.showModal(); });
}
function addLog(cat, day, sec, extra) {
  const l = touch({ id: uid(), cat, day, sec, ...(extra || {}) });
  D.logs[l.id] = l; save(); render();
  toast(`${catLabel(catById(cat))}: +${hm(sec)}`, () => { l.del = true; touch(l); save(); render(); });
}

const view = $('#view');
view.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, li = b.closest('[data-id]'), id = b.dataset.id || (li && li.dataset.id);
  switch (act) {
    // день
    case 'dprev': V.day = addDays(V.day, -1); V.followToday = false; return render();
    case 'dnext': V.day = addDays(V.day, 1); V.followToday = false; return render();
    case 'dtoday': V.day = today(); V.followToday = true; return render();
    case 'kind': setDay(b.dataset.d || V.day, { kind: b.dataset.k }); return render();
    case 'skip': { const d = b.dataset.d || V.day; setDay(d, { skip: !skipped(d) }); return render(); }
    case 'goweek': V.week = weekStart(V.day); return go('week');
    case 'gocats': return go('cats');
    case 'timer': return toggleTimer(id);
    case 'done': {
      const t = realize(getTask(id)); if (!t) return;
      t.done = !t.done; t.doneDay = t.done ? today() : null;
      if (t.done) stopTimer(t);
      touch(t); save(); return render();
    }
    case 'totoday': { const t = D.tasks[id]; if (t) { t.day = today(); touch(t); save(); render(); } return; }
    case 'edit': { const t = getTask(id); return t && openTask(t); }
    case 'quick': return addLog(b.dataset.cat, V.day, +b.dataset.m * 60);
    case 'addtime': return openTime();
    case 'logdel': { const l = D.logs[id]; if (!l) return; l.del = true; touch(l); save(); render(); return toast('Запись удалена', () => { l.del = false; touch(l); save(); render(); }); }
    case 'nowgo': {
      if (b.dataset.id) return toggleTimer(b.dataset.id);
      const c = catById(b.dataset.cat); if (!c) return;
      const t = touch({ id: uid(), title: c.name, cat: c.id, day: today(), done: false, log: {}, run: 0, created: Date.now() });
      D.tasks[t.id] = t; return toggleTimer(t.id);
    }
    // перерисовываем только строку повтора, чтобы не стереть набранное название
    case 'reptoggle': V.newRep = V.newRep ? null : [wdIdx(V.day)]; return paintRep();
    case 'nwd': { const i = +b.dataset.wd, s = new Set(V.newRep || []); s.has(i) ? s.delete(i) : s.add(i); V.newRep = [...s].sort(); return paintRep(); }
    // неделя
    case 'wprev': V.week = addDays(V.week, -7); V.sel = null; return render();
    case 'wnext': V.week = addDays(V.week, 7); V.sel = null; return render();
    case 'wnow': V.week = weekStart(today()); V.sel = null; return render();
    case 'gow': V.week = b.dataset.w; V.sel = null; render(); return window.scrollTo(0, 0);
    case 'sel': V.sel = V.sel === b.dataset.d ? null : b.dataset.d; return render();
    case 'openday': V.day = b.dataset.d; V.followToday = V.day === today(); return go('home');
    case 'copyplan': setWeek(V.week, { plan: { ...planOf(addDays(V.week, -7)) } }); return render();
    // итоги
    case 'review': return openReview(b.dataset.w);
    case 'auto': return openAuto(b.dataset.for);
    case 'rvhide': V.hideReview = true; return render();
    case 'rvback': V.rv = null; return go('week');
    case 'rvkind': { const order = ['normal', 'main', 'off'], i = +b.dataset.i; V.rv.kinds[i] = order[(order.indexOf(V.rv.kinds[i]) + 1) % 3]; return render(); }
    case 'rvsave': {
      const R = V.rv, next = addDays(R.ws, 7), td = today(), moveTo = next > td ? next : td;
      const plan = {}; for (const [c, m] of Object.entries(R.plan)) if (m > 0 && catById(c)) plan[c] = m;
      setWeek(next, { plan }, true);
      weekDays(next).forEach((d, i) => { if (R.kinds[i] !== kindOf(d)) setDay(d, { kind: R.kinds[i] }, true); });
      let moved = 0;
      for (const [tid, on] of Object.entries(R.move)) { const t = D.tasks[tid]; if (on && t && !t.del && !t.done) { t.day = moveTo; touch(t); moved++; } }
      setWeek(R.ws, { reviewed: true }, true);
      save(); V.rv = null; V.week = next; go('week');
      return toast('План сохранён' + (moved ? `, перенесено задач: ${moved}` : ''));
    }
    // категории
    case 'cedit': V.editCat = V.editCat === id ? null : id; return render();
    case 'ccolor': { const c = D.cats[id]; c.color = b.dataset.v; touch(c); save(); return render(); }
    case 'cemoji': { const c = D.cats[id]; c.emoji = b.dataset.v; c.img = ''; touch(c); save(); return render(); }
    case 'cphoto': photoFor = id; return $('#photoFile').click();
    case 'cphotodel': { const c = D.cats[id]; c.img = ''; touch(c); save(); return render(); }
    case 'gotpl': go('set'); { const el = $('#tplCard'); if (el) el.scrollIntoView({ block: 'center' }); } return;
    case 'tour': return startTour();
    case 'cmode': { const c = D.cats[id]; c.mode = b.dataset.v; touch(c); save(); return render(); }
    case 'cdel': {
      const c = D.cats[id], n = live('tasks').filter(x => x.cat === id).length;
      if (!await ask(`Удалить «${c.name}»?${n ? ` ${n} задач останутся без категории.` : ''}`, 'Удалить', true)) return;
      c.del = true; touch(c); V.editCat = null; save(); render();
      return toast('Категория удалена', () => { c.del = false; touch(c); save(); render(); });
    }
    // настройки
    case 'theme': S.theme = b.dataset.v; saveS(); applyTheme(); return render();
    case 'tpl': {
      const i = +b.dataset.i, order = ['normal', 'main', 'off'];
      const kinds = D.tpl.kinds.slice(); kinds[i] = order[(order.indexOf(kinds[i]) + 1) % 3];
      D.tpl = touch({ kinds }); save(); return render();
    }
    case 'syncon': {
      const v = $('#tokenIn').value.trim();
      if (!v) return toast('Вставь токен');
      S.token = v; S.gist = ''; saveS(); render(); return sync();
    }
    case 'syncnow': return sync();
    case 'syncoff':
      if (!await ask('Отключить синхронизацию на этом устройстве? Данные здесь и в gist останутся.', 'Отключить')) return;
      S.token = ''; S.gist = ''; S.last = 0; saveS(); syncState = 'off'; return render();
    case 'demoreset': if (!await ask('Стереть изменения и вернуть демо-данные?', 'Начать заново', true)) return; D = demoData(); save(); V.day = today(); V.week = weekStart(today()); V.hideReview = false; return go('home');
    case 'csvtime': return csvTime();
    case 'csvweeks': return csvWeeks();
    case 'export': return download(`every-day-${today()}.json`, JSON.stringify(D, null, 1), 'application/json');
    case 'import': return $('#importFile').click();
    case 'wipe': {
      if (!await ask('Удалить все задачи, категории и планы? Если включена синхронизация, удаление дойдёт и до другого устройства.', 'Удалить всё', true)) return;
      const now = Date.now();
      for (const c of COLL) for (const x of Object.values(D[c])) { x.del = true; x.u = now; }
      save(); render(); return toast('Всё удалено');
    }
  }
});

view.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  if (form.dataset.form === 'task') {
    const title = form.title.value.trim(); if (!title) return;
    const cat = form.cat.value || '';
    S.lastCat = cat; saveS();
    if (V.newRep && V.newRep.length) {
      const r = touch({ id: uid(), title, cat, days: V.newRep.slice(), start: V.day, created: Date.now() });
      D.recur[r.id] = r; V.newRep = null;
    } else {
      const t = touch({ id: uid(), title, cat, day: V.day, done: false, log: {}, run: 0, created: Date.now() });
      D.tasks[t.id] = t;
    }
    save(); render();
    const inp = view.querySelector('form[data-form="task"] input[name="title"]'); if (inp) inp.focus();
  } else if (form.dataset.form === 'cat') {
    const name = form.name.value.trim(); if (!name) return;
    const used = new Set(cats().map(c => c.color));
    const c = touch({ id: uid(), name, color: SLOTS.find(s => !used.has(s)) || SLOTS[cats().length % SLOTS.length], emoji: '', mode: 'min', order: Date.now() });
    D.cats[c.id] = c; V.editCat = c.id; save(); render(); // сразу открываем редактор: цвет, значок, фото
  }
});

view.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.plan) {
    const v = parseHours(el.value);
    if (el.value.trim() && (!isFinite(v) || v < 0 || v > 168)) { toast('Введи число часов от 0 до 168'); return render(); }
    setPlan(V.week, el.dataset.plan, Math.round((v || 0) * 60));
    return render();
  }
  if (el.dataset.cemoji) {
    const c = D.cats[el.dataset.cemoji], g = firstGrapheme(el.value);
    if (g) { c.emoji = g; c.img = ''; touch(c); save(); }
    return render();
  }
  if (el.dataset.cname) {
    const c = D.cats[el.dataset.cname], v = el.value.trim();
    if (v && v !== c.name) { c.name = v; touch(c); save(); }
    return render();
  }
  if (el.dataset.rvmove && V.rv) V.rv.move[el.dataset.rvmove] = el.checked;
});
view.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.rvplan && V.rv) { const v = parseHours(el.value); V.rv.plan[el.dataset.rvplan] = isFinite(v) && v > 0 ? Math.round(Math.min(v, 168) * 60) : 0; }
});
view.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && (e.target.dataset.plan || e.target.dataset.rvplan)) e.target.blur(); });

$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const x = JSON.parse(await file.text());
    if (!x || x.v !== 2) throw new Error('это не файл Every Day');
    merge(D, x); save(); render(); toast('Загружено');
  } catch (err) { toast('Не получилось: ' + err.message); }
});

/* ---------- окно задачи ---------- */
const dlg = $('#dlg'), dform = $('#dlgForm');
let dTask = null, dMin0 = 0, dDays = [];
function paintDays() { $('#dlgDays').innerHTML = wdChips(dDays, 'dwd'); }
function openTask(t) {
  dTask = t;
  const r = t.recur && D.recur[t.recur];
  dform.title.value = t.title;
  dform.cat.innerHTML = catOpts(t.cat);
  dform.day.value = t.day;
  dMin0 = Math.round(((t.log && t.log[V.day]) || 0) / 60);
  dform.min.value = dMin0 || '';
  dform.min.placeholder = '0';
  dDays = r && !r.del ? r.days.slice() : [];
  paintDays();
  $('#dlgDelAll').hidden = !(r && !r.del);
  $('#dlgDel').textContent = r && !r.del ? 'Удалить этот день' : 'Удалить';
  $('#dlgMinLbl').textContent = `Время за ${V.day === today() ? 'сегодня' : fmtShort(V.day)}`;
  $('#dlgInfo').textContent = (t.run ? 'Таймер идёт: текущий отрезок добавится, когда остановишь. ' : '') + 'Всего по задаче: ' + hm(taskTotal(t))
    + (r && !r.del ? '. Название, категория и дни меняются для всего повтора.' : '');
  dlg.returnValue = ''; dlg.showModal();
}
$('#dlgDays').addEventListener('click', e => {
  const b = e.target.closest('[data-wd]'); if (!b) return;
  const i = +b.dataset.wd, s = new Set(dDays); s.has(i) ? s.delete(i) : s.add(i); dDays = [...s].sort(); paintDays();
});
dlg.addEventListener('close', async () => {
  let t = dTask; dTask = null;
  if (!t) return;
  const rv = dlg.returnValue, r = t.recur && D.recur[t.recur] && !D.recur[t.recur].del ? D.recur[t.recur] : null;
  if (rv === 'del') {
    const x = t.virtual ? { ...t } : t; delete x.virtual;
    x.del = true; x.run = 0; D.tasks[x.id] = touch(x); save(); render();
    return toast('Удалено', () => { x.del = false; touch(x); save(); render(); });
  }
  if (rv === 'delall' && r) {
    if (!await ask(`Перестать повторять «${r.title}» с ${fmtShort(t.day)}? Прошлые дни останутся.`, 'Перестать повторять', true)) return;
    r.end = addDays(t.day, -1); if (r.end < r.start) r.del = true; touch(r);
    for (const x of live('tasks')) if (x.recur === r.id && x.day >= t.day && !x.done) { x.del = true; x.run = 0; touch(x); }
    save(); return render();
  }
  if (rv !== 'save') return;
  t = realize(t);
  t.title = dform.title.value.trim() || t.title;
  t.cat = dform.cat.value || '';
  if (dform.day.value) t.day = dform.day.value;
  const m = parseInt(dform.min.value, 10) || 0;
  if (m !== dMin0 && m >= 0) { t.log = { ...(t.log || {}) }; if (m) t.log[V.day] = m * 60; else delete t.log[V.day]; }
  touch(t);
  if (r) {
    if (dDays.length) { r.title = t.title; r.cat = t.cat; r.days = dDays.slice(); touch(r); }
    else { r.end = addDays(t.day, -1); if (r.end < r.start) r.del = true; touch(r); t.recur = null; } // дни сняты — повтор заканчивается
  } else if (dDays.length) {
    // обычная задача становится повторяющейся: этот экземпляр получает id шаблона, чтобы не было дубля
    const nr = touch({ id: uid(), title: t.title, cat: t.cat, days: dDays.slice(), start: t.day, created: t.created || Date.now() });
    D.recur[nr.id] = nr;
    if (dDays.includes(wdIdx(t.day))) { const nt = { ...t, id: nr.id + ':' + t.day, recur: nr.id }; D.tasks[nt.id] = touch(nt); t.del = true; t.run = 0; touch(t); }
  }
  save(); render();
});

// кнопки «Отмена» и подобные: закрывают окно с нужным результатом, но не отправляют форму (Enter = основное действие)
document.addEventListener('click', e => { const b = e.target.closest('[data-close]'); if (b) b.closest('dialog').close(b.dataset.close); });
$('#dlgDel').addEventListener('click', () => dlg.close('del'));
$('#dlgDelAll').addEventListener('click', () => dlg.close('delall'));

/* ---------- окно «добавить время» ---------- */
const tdlg = $('#tdlg'), tform = $('#tForm');
function openTime() {
  const ts = dayTasks(V.day).filter(t => !t.done || taskSecOn(t, V.day));
  tform.target.innerHTML = `<optgroup label="Категория">${cats().map(c => `<option value="c:${c.id}">${esc(catLabel(c))}</option>`).join('')}<option value="c:">Без категории</option></optgroup>`
    + (ts.length ? `<optgroup label="Задача этого дня">${ts.map(t => `<option value="t:${esc(t.id)}">${esc(t.title)}</option>`).join('')}</optgroup>` : '');
  tform.day.value = V.day; tform.from.value = ''; tform.to.value = ''; tform.min.value = '';
  paintDur();
  tdlg.returnValue = ''; tdlg.showModal();
}
function tDuration() {
  const from = tform.from.value, to = tform.to.value;
  if (from && to) { const a = +from.slice(0, 2) * 60 + +from.slice(3), b = +to.slice(0, 2) * 60 + +to.slice(3); return ((b - a + 1440) % 1440) * 60; }
  return (parseInt(tform.min.value, 10) || 0) * 60;
}
function paintDur() {
  const sec = tDuration(), m = Math.round(sec / 60);
  tform.querySelectorAll('[data-min]').forEach(b => b.setAttribute('aria-pressed', !(tform.from.value && tform.to.value) && +b.dataset.min === m));
  $('#tDur').textContent = sec > 0 ? 'Будет добавлено: ' + hm(sec) + (tform.from.value && tform.to.value ? ` (${tform.from.value}–${tform.to.value})` : '') : '';
}
tform.addEventListener('click', e => { const b = e.target.closest('[data-min]'); if (!b) return; tform.min.value = b.dataset.min; tform.from.value = ''; tform.to.value = ''; paintDur(); });
tform.addEventListener('input', e => { if (e.target.name === 'min' && e.target.value) { tform.from.value = ''; tform.to.value = ''; } paintDur(); });
tdlg.addEventListener('close', () => {
  if (tdlg.returnValue !== 'save') return;
  const day = tform.day.value || V.day, from = tform.from.value, to = tform.to.value;
  let sec = 0, extra = {};
  if (from && to) {
    const a = +from.slice(0, 2) * 60 + +from.slice(3), b = +to.slice(0, 2) * 60 + +to.slice(3);
    sec = ((b - a + 1440) % 1440) * 60; extra = { from, to };
  } else sec = (parseInt(tform.min.value, 10) || 0) * 60;
  if (sec <= 0) return toast('Укажи время: «с — по» или минуты');
  const v = tform.target.value;
  if (v.startsWith('t:')) {
    const t = realize(getTask(v.slice(2))); if (!t) return;
    t.log = { ...(t.log || {}) }; t.log[day] = (t.log[day] || 0) + sec; touch(t); save(); render();
    return toast(`${t.title}: +${hm(sec)}`);
  }
  addLog(v.slice(2), day, sec, extra);
});

/* ---------- забытый таймер ---------- */
const gdlg = $('#gdlg'), gform = $('#gForm');
let gTask = null;
function checkGuard() {
  const t = runningTask();
  if (!t || dlg.open || tdlg.open || gdlg.open) return;
  if (Date.now() - Math.max(t.run, t.ack || 0) < GUARD_MS) return;
  gTask = t;
  $('#gText').textContent = `«${t.title}» идёт уже ${hm((Date.now() - t.run) / 1000)}, с ${new Date(t.run).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}. Если забыл остановить, укажи, когда закончил.`;
  gform.end.min = localDT(t.run); gform.end.max = localDT(Date.now());
  gform.end.value = localDT(Math.min(Date.now(), t.run + 3600e3));
  gdlg.returnValue = ''; gdlg.showModal();
}
gdlg.addEventListener('close', () => {
  const t = gTask; gTask = null;
  if (!t || !t.run) return;
  const rv = gdlg.returnValue;
  if (rv === 'cut') {
    const end = new Date(gform.end.value).getTime();
    if (!isFinite(end) || end <= t.run) { toast('Время конца должно быть позже начала'); return checkGuard(); }
    stopTimer(t, end);
  } else if (rv === 'now') stopTimer(t);
  else { t.ack = Date.now(); touch(t); }
  save(); render();
});

/* ---------- автоплан ----------
   У каждой категории «не меньше» свой способ получить часы:
   p   — приоритет 1/2/3, делит остаток по весам (по умолчанию 1 : 2 : 3)
   pct — своя доля в процентах от того, что осталось после «ровно»
   fix — ровно столько часов
   off — без часов
   Сначала вычитаются «ровно», затем проценты, остаток делится по приоритетам. */
const adlg = $('#adlg'), aform = $('#aForm');
let AP = null;
const apCfg = id => (D.ap.cats && D.ap.cats[id]) || { t: 'p', v: 2 };
function openAuto(kind) {
  const ws = kind === 'rv' ? addDays(V.rv.ws, 7) : V.week;
  const base = kind === 'rv' ? { ...V.rv.plan } : { ...planOf(ws) };
  const src = kind === 'rv' ? V.rv.ws : addDays(ws, -7), st = weekStats(src);
  const debt = {};
  for (const c of cats()) {
    if (isMax(c) || !st.plan[c.id]) continue;
    const fa = st.days.reduce((a, d) => a + (st.f[d][c.id] || 0), 0), gap = st.plan[c.id] - fa / 60;
    if (gap >= 15) debt[c.id] = gap;
  }
  const mins = cats().filter(c => !isMax(c)), sumBase = mins.reduce((a, c) => a + (base[c.id] || 0), 0);
  AP = { kind, ws, base, debt, cfg: Object.fromEntries(mins.map(c => [c.id, { ...apCfg(c.id) }])) };
  const total = D.ap.total || Math.round(sumBase / 60) || 20;
  aform.total.value = Math.min(80, total); aform.totalN.value = hoursStr(total * 60);
  const w = D.ap.w || [1, 2, 3];
  aform.w1.value = String(w[0]).replace('.', ','); aform.w2.value = String(w[1]).replace('.', ','); aform.w3.value = String(w[2]).replace('.', ',');
  $('#aFor').textContent = 'План на ' + fmtRange(ws);
  const dsum = sumv(debt);
  $('#aDebtRow').hidden = !dsum; aform.debt.checked = false;
  $('#aDebtLbl').textContent = `Добавить недобор недели ${fmtRange(src)} (+${hmm(dsum * 60)})`;
  const opt = (v, n, cur) => `<option value="${v}"${cur === v ? ' selected' : ''}>${n}</option>`;
  $('#aRows').innerHTML = mins.map(c => {
    const g = AP.cfg[c.id], sel = g.t === 'p' ? 'p' + g.v : g.t;
    return `<div class="aprow" data-c="${c.id}" style="--cc:var(--${c.color})">
      <div class="pname">${catDot(c)}<span>${esc(c.name)}</span></div>
      <b class="ares">0:00</b>
      <div class="ctl">
        <select data-ap="t" aria-label="Как считать часы для ${esc(c.name)}">${opt('p1', 'Низкий приоритет', sel)}${opt('p2', 'Средний приоритет', sel)}${opt('p3', 'Высокий приоритет', sel)}${opt('pct', 'Своя доля, %', sel)}${opt('fix', 'Ровно, часов', sel)}${opt('off', 'Без часов', sel)}</select>
        <span class="aval"${g.t === 'pct' || g.t === 'fix' ? '' : ' hidden'}><input type="text" inputmode="decimal" data-ap="v" value="${g.t === 'fix' ? hoursStr(g.v) : g.t === 'pct' ? g.v : ''}" aria-label="Значение для ${esc(c.name)}"><span class="mute sm">${g.t === 'fix' ? 'ч' : '%'}</span></span>
      </div>
      <div class="pbar"><i style="width:0"></i></div>
    </div>`;
  }).join('') + cats().filter(isMax).map(c => `<div class="aprow" style="--cc:var(--${c.color})"><div class="pname">${catDot(c)}<span>${esc(c.name)}</span></div><span class="mute sm">лимит ${hmm((base[c.id] || 0) * 60)}, не делится</span></div>`).join('');
  calcAuto();
  adlg.returnValue = ''; adlg.showModal();
}
function readAuto() {
  const total = parseHours(aform.totalN.value);
  const w = [aform.w1, aform.w2, aform.w3].map(x => { const v = parseHours(x.value); return isFinite(v) && v >= 0 ? v : 0; });
  return { total: isFinite(total) && total > 0 ? Math.min(total, 168) : 0, w };
}
function calcAuto() {
  const { total, w } = readAuto(), T = total * 60, cfg = AP.cfg, res = {}, warn = [];
  const ids = Object.keys(cfg);
  const fixSum = ids.filter(i => cfg[i].t === 'fix').reduce((a, i) => a + (cfg[i].v || 0), 0);
  if (fixSum > T) warn.push(`«Ровно» в сумме ${hmm(fixSum * 60)} — больше, чем всего часов.`);
  const rem = Math.max(0, T - fixSum);
  const pctIds = ids.filter(i => cfg[i].t === 'pct'), pctSum = pctIds.reduce((a, i) => a + (cfg[i].v || 0), 0);
  if (pctSum > 100) warn.push(`Доли в процентах дают ${Math.round(pctSum)}%. Поделил их пропорционально.`);
  const pctPart = rem * Math.min(pctSum, 100) / 100;
  const pIds = ids.filter(i => cfg[i].t === 'p'), wSum = pIds.reduce((a, i) => a + (w[cfg[i].v - 1] || 0), 0);
  const pool = rem - pctPart;
  const raw = {};
  for (const i of ids) {
    const g = cfg[i];
    let m = g.t === 'fix' ? g.v || 0 : g.t === 'pct' ? (pctSum ? pctPart * (g.v || 0) / pctSum : 0) : g.t === 'p' ? (wSum ? pool * (w[g.v - 1] || 0) / wSum : 0) : 0;
    if (aform.debt.checked && AP.debt[i] && g.t !== 'off') m += AP.debt[i];
    raw[i] = m;
  }
  // округляем до 15 минут так, чтобы сумма не «уезжала»: остаток отдаём тем, у кого дробная часть больше
  const goal = Math.round(sumv(raw) / 15) * 15;
  for (const i of ids) res[i] = Math.floor(raw[i] / 15) * 15;
  let extra = Math.round((goal - sumv(res)) / 15);
  for (const i of ids.slice().sort((x, y) => (raw[y] - res[y]) - (raw[x] - res[x]))) { if (extra <= 0) break; if (raw[i] - res[i] > 0) { res[i] += 15; extra--; } }
  const left = pIds.length && wSum ? 0 : pool;
  const mx = Math.max(1, ...Object.values(res));
  document.querySelectorAll('#aRows .aprow[data-c]').forEach(row => {
    const m = res[row.dataset.c] || 0;
    row.querySelector('.ares').textContent = hmm(m * 60);
    row.querySelector('.pbar i').style.width = (m / mx * 100) + '%';
  });
  const sum = sumv(res);
  $('#aSum').innerHTML = `Итого: <b>${hmm(sum * 60)}</b>`;
  $('#aLeft').textContent = left >= 15 ? `не распределено ${hmm(left * 60)}` : '';
  $('#aWarn').hidden = !warn.length; $('#aWarn').textContent = warn.join(' ');
  AP.res = res;
  return res;
}
aform.addEventListener('input', e => {
  const el = e.target, row = el.closest('.aprow');
  if (el.name === 'total') aform.totalN.value = el.value;
  if (el.name === 'totalN') { const v = parseHours(el.value); if (isFinite(v)) aform.total.value = Math.min(80, Math.max(1, Math.round(v))); }
  if (row && el.dataset.ap === 't') {
    const g = AP.cfg[row.dataset.c], v = el.value, box = row.querySelector('.aval'), inp = box.querySelector('input');
    if (v[0] === 'p' && v !== 'pct') { g.t = 'p'; g.v = +v[1]; box.hidden = true; }
    else {
      g.t = v; box.hidden = v === 'off';
      if (v === 'fix') { g.v = AP.res[row.dataset.c] || 60; inp.value = hoursStr(g.v); box.querySelector('span').textContent = 'ч'; }
      if (v === 'pct') { const t = readAuto().total * 60; g.v = t ? Math.round((AP.res[row.dataset.c] || 0) / t * 100) : 0; inp.value = g.v; box.querySelector('span').textContent = '%'; }
    }
  }
  if (row && el.dataset.ap === 'v') {
    const g = AP.cfg[row.dataset.c], x = parseHours(el.value);
    g.v = !isFinite(x) || x < 0 ? 0 : g.t === 'fix' ? Math.round(Math.min(x, 168) * 60) : Math.min(x, 100);
  }
  calcAuto();
});
aform.addEventListener('change', e => { if (e.target.name === 'debt') calcAuto(); });
adlg.addEventListener('close', () => {
  if (adlg.returnValue !== 'apply' || !AP) return;
  const res = calcAuto(), plan = { ...AP.base };
  for (const [id, m] of Object.entries(res)) { if (m > 0) plan[id] = m; else delete plan[id]; }
  const { total, w } = readAuto();
  D.ap = touch({ total, w, cats: { ...(D.ap.cats || {}), ...clone(AP.cfg) } });
  if (AP.kind === 'rv' && V.rv) { V.rv.plan = plan; save(); }
  else setWeek(AP.ws, { plan });
  AP = null; render(); toast('План заполнен');
});

/* ================= синхронизация через GitHub Gist ================= */
let syncState = 'off', syncMsg = '', syncTimer = 0, syncing = false, again = false;
function setSync(st, msg) { syncState = st; syncMsg = msg || ''; renderTop(); const el = $('#syncStatus'); if (el) el.textContent = syncText(); }
function queueSync() { if (!S.token || DEMO) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 2500); }
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, {
    ...opt, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + S.token, Accept: 'application/vnd.github+json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) }
  });
  if (!r.ok) {
    const e = new Error(r.status === 401 ? 'GitHub не принял токен (401). Проверь, что он скопирован целиком и не истёк.'
      : r.status === 403 || r.status === 404 && !path.startsWith('/gists/') ? 'Нет доступа (' + r.status + '). Токену нужно право Gists: Read and write.'
      : 'GitHub ответил ' + r.status);
    e.status = r.status; throw e;
  }
  return r.json();
}
async function readGist(g) {
  const f = g && g.files && g.files[FILE]; if (!f) return null;
  const txt = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
  const x = JSON.parse(txt); return x && x.v === 2 ? x : null;
}
async function sync() {
  if (!S.token || DEMO) return;
  if (syncing) { again = true; return; }
  if (!navigator.onLine) return setSync('err', 'нет интернета');
  syncing = true; setSync('busy');
  try {
    let g = null;
    if (S.gist) { try { g = await gh('/gists/' + S.gist); } catch (e) { if (e.status === 404) { S.gist = ''; saveS(); } else throw e; } }
    if (!S.gist) { // ищем уже созданный gist (например, на другом устройстве)
      const list = await gh('/gists?per_page=100');
      const hit = list.find(x => x.files && x.files[FILE]);
      if (hit) { g = await gh('/gists/' + hit.id); S.gist = hit.id; saveS(); }
    }
    const remote = await readGist(g);
    const before = JSON.stringify(D);
    if (remote) merge(D, remote);
    if (JSON.stringify(D) !== before) {
      localStorage.setItem(KEY, JSON.stringify(D));
      if (!isEditing()) render();
    }
    const needPush = !remote || merge(clone(remote), D);
    if (needPush) {
      const files = { [FILE]: { content: JSON.stringify(D) } };
      if (S.gist) await gh('/gists/' + S.gist, { method: 'PATCH', body: JSON.stringify({ files }) });
      else { const ng = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Every Day — данные приложения', public: false, files }) }); S.gist = ng.id; }
    }
    S.last = Date.now(); saveS(); setSync('ok');
    if (V.tab === 'set' && !isEditing()) render();
  } catch (e) {
    setSync('err', e.message || String(e));
  } finally {
    syncing = false;
    if (again) { again = false; queueSync(); }
  }
}

/* ================= запуск ================= */
const isEditing = () => tourI >= 0 || $('#cdlg').open || dlg.open || tdlg.open || gdlg.open || adlg.open || V.tab === 'review' || (document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName));
let tick = 0;
setInterval(() => {
  document.querySelectorAll('[data-live]').forEach(el => { const t = getTask(el.dataset.live); if (t) el.textContent = clock(taskSecOn(t, el.dataset.day)); });
  const r = runningTask(), rt = $('#runTime');
  if (r && rt) rt.textContent = clock((Date.now() - r.run) / 1000);
  updateTitle();
  tick++;
  if (r && tick % 30 === 0 && !isEditing()) render(); // раз в 30 с обновляем полоски плана
  if (r && tick % 600 === 0) checkGuard();
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const fresh = (() => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } })();
  if (fresh && fresh.v === 2) merge(D, fresh); // если правили в другой вкладке
  if (V.followToday) V.day = today();
  if (!isEditing()) render();
  checkGuard();
  sync();
});
window.addEventListener('online', () => sync());
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 120000);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

$('#demoTag').hidden = !DEMO;
if (DEMO) { // в демо — плавающая панель, чтобы быстро сравнить варианты
  document.body.insertAdjacentHTML('beforeend', `<button id="lookFab" type="button" aria-expanded="false" aria-controls="lookPanel">Оформление</button>
  <div id="lookPanel" hidden><div class="card-h"><h2 style="font-size:1.05rem">Вариант оформления</h2><button class="icon" type="button" id="lookClose" aria-label="Закрыть">✕</button></div>
  <div class="seg" role="group" aria-label="Тема"><button type="button" data-theme-set="light">Светлая</button><button type="button" data-theme-set="dark">Тёмная</button><button type="button" data-theme-set="system">Авто</button></div>
  <div id="toneList"></div>
  <div class="looks" id="lookList"></div></div>`);
  $('#lookFab').onclick = () => { const pn = $('#lookPanel'); pn.hidden = !pn.hidden; $('#lookFab').setAttribute('aria-expanded', !pn.hidden); paintLooks(); };
  $('#lookClose').onclick = () => { $('#lookPanel').hidden = true; $('#lookFab').setAttribute('aria-expanded', 'false'); };
}
applyTheme();
if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(D));
render();
if (!S.tourDone) startTour(); else checkGuard();
sync();
})();
</script>
