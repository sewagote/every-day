<!doctype html>
<html lang="ru" data-demo="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Day</title>
<meta name="theme-color" content="#EEF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Every Day">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%236366F1'/%3E%3Cpath d='M20 33l8 8 16-17' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --card:#FFFFFF; --ink:#172033; --mute:#5F6A85; --line:#DCE2EE;
  --accent:#2F5BFF; --soft:#E4EAFF; --done:#1F9D6B; --danger:#D9485F; --low:#9AA3B8; --on-accent:#fff;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151C; --card:#1A1F2A; --ink:#E8ECF4; --mute:#98A2BC; --line:#2A3142;
    --accent:#7D98FF; --soft:#232C4A; --done:#3CC08A; --danger:#F0697E; --low:#6E7891; --on-accent:#10131A;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  }
}
:root[data-theme="dark"]{
  --bg:#12151C; --card:#1A1F2A; --ink:#E8ECF4; --mute:#98A2BC; --line:#2A3142;
  --accent:#7D98FF; --soft:#232C4A; --done:#3CC08A; --danger:#F0697E; --low:#6E7891; --on-accent:#10131A;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1{font-size:1.85rem;line-height:1.1;letter-spacing:-.02em;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
h3{font-size:.95rem;margin:16px 0 8px}
.mute{color:var(--mute)} .sm{font-size:.85rem} .grow{flex:1}
.good{color:var(--done)} .bad{color:var(--danger)}
p{margin:0}

/* верх и нижнее меню */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:env(safe-area-inset-top,0px) 16px 0}
.top-in{max-width:760px;margin:0 auto;height:54px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:1.1rem;letter-spacing:-.02em;white-space:nowrap}
.run-chip{display:flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;max-width:62vw;min-width:0}
.run-chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-chip .n{font-variant-numeric:tabular-nums}
.sync{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;flex:none}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--low)}
.sync.ok i{background:var(--done)} .sync.err i{background:var(--danger)} .sync.busy i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{max-width:760px;margin:0 auto;padding:6px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.tabs button{flex:1;max-width:150px;border:0;background:none;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--mute)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft)}

/* общие элементы */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.card-h h2{margin:0;flex:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head{display:flex;align-items:center;gap:8px;margin-top:12px}
.date{margin-top:4px;color:var(--mute)}
.date::first-letter{text-transform:uppercase}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem;white-space:nowrap}
.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.2rem;line-height:1;flex:none}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.secondary{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px}
.danger{color:var(--danger)}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
input[type=text],input[type=password],input[type=date],select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;min-width:0}
input[type=date]{min-height:42px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg);gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 11px;font-size:.88rem;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .14);font-weight:600}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip.skip[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.note{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:.9rem}
.note.warn{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.empty{padding:14px 4px;color:var(--mute);font-size:.92rem}
.cdot{width:24px;height:24px;border-radius:7px;background:var(--cc);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;flex:none;overflow:hidden}
.cdot img{width:100%;height:100%;object-fit:cover;display:block}
.cdot.big{width:44px;height:44px;border-radius:12px;font-size:1.3rem}
.iconrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.emo-in{width:64px;text-align:center;font-size:1.2rem}
/* подсказки */
.help-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0;font-weight:700;flex:none}
#tour{position:fixed;inset:0;z-index:80}
.tour-spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgb(0 0 0 / .58);transition:all .25s ease;pointer-events:none}
.tour-card{position:absolute;left:12px;right:12px;max-width:380px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgb(0 0 0 / .3);display:grid;gap:8px;transition:top .25s ease}
.tour-card h2{margin:0}
.tour-card p{font-size:.93rem;line-height:1.5}
.tour-dots{display:flex;gap:5px}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-dots i.on{background:var(--accent)}
details.faq{border-top:1px solid var(--line);padding:10px 0}
details.faq:first-of-type{border-top:0}
details.faq summary{cursor:pointer;font-weight:500}
details.faq p{margin-top:6px;font-size:.9rem;color:var(--mute);line-height:1.5}

/* строки план/факт */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pname{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.pname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnum{font-variant-numeric:tabular-nums;font-size:.9rem;text-align:right;white-space:nowrap}
.pbar{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cc);border-radius:4px}
.pbar b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.6}
.pmeta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--mute)}
.hrs{display:flex;align-items:center;gap:6px}
.hrs input{width:64px;text-align:right;padding:7px 9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--mute);margin-top:8px}
.legend .mk{display:inline-block;width:2px;height:10px;background:var(--ink);opacity:.6;vertical-align:-1px;margin-right:5px}

/* задачи */
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.add input[type=text]{flex:1 1 200px}
.add select{flex:1 1 120px;max-width:220px}
.tasks{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.task{display:flex;align-items:center;gap:10px;background:var(--bg);border-left:4px solid var(--cc);border-radius:12px;padding:8px 10px}
.task .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;padding:0;font-size:.9rem;font-weight:700}
.task.done .chk{background:var(--done);border-color:var(--done);color:#fff}
.task .body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0}
.task .title{display:block;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--mute)}
.task .meta{display:block;font-size:.8rem;color:var(--mute)}
.timer{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-variant-numeric:tabular-nums;font-size:.88rem;flex:none}
.timer.run{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* неделя */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.dcell{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.dcell .wd{color:var(--mute);font-size:.7rem;text-transform:uppercase}
.dcell .dn{font-size:1.05rem;font-weight:700;line-height:1.2}
.dcell .k{font-size:.68rem;color:var(--mute);height:1.2em;white-space:nowrap}
.dcell .f{font-size:.7rem;font-variant-numeric:tabular-nums;color:var(--mute)}
.dcell.main{border-color:var(--accent);background:var(--soft)}
.dcell.main .k{color:var(--accent);font-weight:600}
.dcell.off{background:var(--bg)}
.dcell.skip .dn{text-decoration:line-through;color:var(--danger)}
.dcell.today .wd{color:var(--accent);font-weight:700}
.dcell[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stats span{font-size:.78rem;color:var(--mute)}
.gwrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
table.g{border-collapse:collapse;width:100%;font-size:.82rem;font-variant-numeric:tabular-nums}
.g th,.g td{padding:7px 4px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.g thead th{border-top:0;font-weight:500;color:var(--mute);font-size:.74rem}
.g th:first-child,.g td:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-right:8px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.g th,.g td{padding:7px 2px}.g th:first-child,.g td:first-child{max-width:78px;font-size:.78rem}.g td small{font-size:.66rem}}
.g td small{display:block;color:var(--mute);font-size:.7rem}
.g td.ok b{color:var(--done)} .g td.miss b{color:var(--danger)}
.g td.offd{color:var(--low)}
.g th.skip{color:var(--danger);text-decoration:line-through}
.g th.main{color:var(--accent);font-weight:700}
.g tfoot td{font-weight:600}

/* категории и настройки */
.crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cedit{display:grid;gap:10px;padding:4px 0 14px}
.swatches,.emojis{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;background:var(--cc);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.emo{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0;font-size:1.1rem}
.emo[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.tpl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.tpl button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 2px;font-size:.78rem;display:grid;gap:2px}
.tpl button b{font-size:.9rem}
.tpl button.main{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.tpl button.off{background:var(--bg);color:var(--mute)}
.field{display:grid;gap:5px;margin-top:10px;font-size:.85rem;color:var(--mute)}
.field input{color:var(--ink);font-size:1rem;width:100%}
code{font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:5px}
ol.help{margin:8px 0 0;padding-left:20px;font-size:.88rem;color:var(--mute)}
ol.help li{margin:3px 0}

/* сейчас, итоги, повтор, история */
.qadd{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.qadd button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--mute)}
.now{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.now .t{flex:1;min-width:190px;display:grid;gap:2px}
.now .t span:first-child{font-size:.8rem;color:var(--mute)}
.now .t b{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.banner{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--accent)}
.banner .t{flex:1;display:grid;min-width:0}
.banner .t span{font-size:.85rem;color:var(--mute)}
.wdchips{display:flex;gap:4px;flex-wrap:wrap}
.wdchips button{width:40px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:.82rem;padding:0}
.wdchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.repeat-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.85rem;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.rep{font-size:.75rem;color:var(--accent);margin-left:4px}
.tag{font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--mute);font-weight:500;white-space:nowrap}
.loglist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.loglist li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--bg);font-size:.9rem}
.loglist .x{border:0;background:none;color:var(--mute);font-size:1rem;padding:2px 6px}
.hist{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;align-items:end;height:110px;margin-top:12px;border-bottom:1px solid var(--line)}
.hist button{height:100%;display:flex;flex-direction:column;justify-content:flex-end;border:0;background:none;padding:0 2px;border-radius:6px}
.hist button:hover{background:var(--bg)}
.hist i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.hist .ok i{background:var(--done)}
.hist .cur i{opacity:.5}
.hist .none i{background:var(--line)}
.hist .sel{box-shadow:inset 0 0 0 1px var(--ink)}
.hist-x{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;font-size:.64rem;color:var(--mute);text-align:center;margin-top:4px}
.hist-x .ok{color:var(--done);font-weight:700}
.rvrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.rvrow:first-of-type{border-top:0}
.rvrow .n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chk-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.chk-row:first-of-type{border-top:0}
.chk-row input{width:20px;height:20px;flex:none}
.verdict{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg);font-weight:600}
.verdict.ok{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
.trow{display:flex;gap:8px}
.trow label{flex:1}
input[type=time],input[type=datetime-local]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;min-width:0;min-height:42px}
.ap-total{display:flex;align-items:center;gap:10px}
.ap-total input[type=range]{flex:1;width:auto;accent-color:var(--accent)}
.dlg label.hrs{display:flex;flex-direction:row}
.dlg .hrs input{width:58px}
.ap-w{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
.dlg .ap-w input{width:46px;text-align:center;padding:6px 4px}
.aprow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.aprow .ctl{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.dlg .aprow select{width:auto;flex:1;font-size:.9rem;padding:7px 9px}
.aprow .aval{display:flex;align-items:center;gap:6px}
.dlg .aprow .aval input{width:70px;text-align:right;padding:7px 9px}
.aprow .ares{font-variant-numeric:tabular-nums;font-size:1.05rem}
.aprow .pbar{height:6px}
.dlg .chkl{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.9rem}
.dlg .chkl input{width:20px;height:20px;flex:none}
.ap-sum{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding-top:8px;border-top:1px solid var(--line)}

/* диалог и тост */
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg h2{margin:0}
.dlg label{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
.dlg input,.dlg select{color:var(--ink);font-size:1rem;width:100%}
.dlg .wdchips button{width:38px}

<body>

<header class="top">
  <div class="top-in">
    <span class="brand">Every Day</span><span class="tag" id="demoTag" hidden>демо</span>
    <span class="grow"></span>
    <button class="run-chip" id="runChip" type="button" hidden></button>
    <button class="help-btn" id="helpBtn" type="button" title="Подсказки" aria-label="Показать подсказки">?</button>

  </div>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Разделы">
  <button type="button" data-tab="day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>День</button>
  <button type="button" data-tab="week"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Неделя</button>
  <button type="button" data-tab="cats"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Категории</button>
  <button type="button" data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
</nav>

<!-- задача -->
<dialog id="dlg">
  <form method="dialog" class="dlg" id="dlgForm">
    <h2>Задача</h2>
    <label>Название<input type="text" name="title" required maxlength="140" autocomplete="off"></label>
    <label>Категория<select name="cat"></select></label>
    <label>День задачи<input type="date" name="day" required></label>
    <label><span id="dlgMinLbl">Время за день, минут</span><input type="text" name="min" inputmode="numeric" autocomplete="off"></label>
    <div><div class="mute sm" style="margin-bottom:4px">Повторять по дням</div><div class="wdchips" id="dlgDays" role="group" aria-label="Дни повтора"></div></div>
    <p class="mute sm" id="dlgInfo"></p>
    <div class="row">
      <button class="primary" value="save">Сохранить</button>
      <button class="secondary" value="cancel" formnovalidate>Отмена</button>
      <span class="grow"></span>
      <button class="secondary danger" value="del" formnovalidate id="dlgDel">Удалить</button>
      <button class="secondary danger" value="delall" formnovalidate id="dlgDelAll">Удалить повтор</button>

</dialog>

<!-- добавить время вручную -->
<dialog id="tdlg">
  <form method="dialog" class="dlg" id="tForm">
    <h2>Добавить время</h2>
    <label>На что<select name="target"></select></label>
    <label>День<input type="date" name="day" required></label>
    <div class="trow">
      <label>С<input type="time" name="from"></label>
      <label>По<input type="time" name="to"></label>
    </div>

    <div class="row">

</dialog>

<!-- подтверждение (вместо confirm(), который блокируют встроенные просмотрщики) -->

<!-- автоплан -->

    <div id="aRows"></div>
    <label class="chkl" id="aDebtRow"><input type="checkbox" name="debt"><span id="aDebtLbl"></span></label>
    <p class="note warn" id="aWarn" hidden></p>
    <div class="ap-sum"><span id="aSum"></span><span class="mute" id="aLeft"></span></div>

<!-- забытый таймер -->
<dialog id="gdlg">
  <form method="dialog" class="dlg" id="gForm">

</div>

<script>
(() => {
'use strict';

/* ================= утилиты ================= */
// демо-режим: index.html?demo или файл demo.html. Отдельное хранилище, готовые данные, без синхронизации
const DEMO = new URLSearchParams(location.search).has('demo') || document.documentElement.dataset.demo === '1';
const KEY = DEMO ? 'everyday-demo' : 'everyday-v2', SKEY = DEMO ? 'everyday-demo-settings' : 'everyday-settings', FILE = 'every-day.json';
const COLL = ['cats', 'tasks', 'weeks', 'days', 'logs', 'recur'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const clone = o => JSON.parse(JSON.stringify(o));
const sumv = o => Object.values(o).reduce((a, b) => a + b, 0);

// даты храним строкой YYYY-MM-DD в местном времени
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const weekStart = s => addDays(s, -((parse(s).getDay() + 6) % 7));
const wdIdx = s => (parse(s).getDay() + 6) % 7;
const weekDays = ws => [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i));
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const fmtLong = s => parse(s).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parse(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '');
const fmtRange = ws => fmtShort(ws) + ' — ' + fmtShort(addDays(ws, 6));
const hhmm = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const localDT = ms => { const d = new Date(ms); return iso(d) + 'T' + hhmm(ms); };

// длительности
const hmm = sec => { const neg = sec < 0; const m = Math.round(Math.abs(sec) / 60); return (neg ? '−' : '') + Math.floor(m / 60) + ':' + pad(m % 60); };
const hm = sec => { const m = Math.round(Math.max(0, sec) / 60), h = Math.floor(m / 60); return h ? `${h} ч${m % 60 ? ' ' + (m % 60) + ' мин' : ''}` : `${m} мин`; };
const clock = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(s); };
const hoursStr = min => { const h = min / 60; return Number.isInteger(h) ? String(h) : String(Math.round(h * 100) / 100).replace('.', ','); };
const parseHours = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : NaN; };

/* ================= данные =================
   Всё лежит в localStorage. Каждая запись имеет id и u (время последнего изменения).
   Удалённые записи остаются с del:true, чтобы удаление доехало до другого устройства.
   При синхронизации записи склеиваются по id: побеждает та, что изменена позже.
   cats  — категории (mode: 'min' — цель «не меньше», 'max' — лимит «не больше»)
   tasks — задачи; log = {дата: секунды}; run = момент запуска таймера
   logs  — время без задачи (быстрые кнопки и ручной ввод)
   recur — шаблоны повторяющихся задач; экземпляр дня имеет id «шаблон:дата»
   weeks — план недели {plan: {категория: минуты}, reviewed}
   days  — тип дня и пропуск */
const SLOTS = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8'];
const EMOJI = ['🗣️', '💻', '🧮', '📘', '📚', '🧠', '🏋️', '🎧', '✍️', '🎯', '🔬', '🎨', '💼', '🏠', '🧘', '🎮', '⚙️', '🌍', '🧪', '❤️'];
const KN = { main: 'Главный', normal: 'Обычный', off: 'Выходной' };
const W = { main: 2, normal: 1, off: 0 }; // вес дня: главный получает вдвое больше часов, выходной — ноль
const GUARD_MS = 3 * 3600e3;              // через сколько спрашивать, не забыт ли таймер

const blank = () => ({ v: 2, cats: {}, tasks: {}, weeks: {}, days: {}, logs: {}, recur: {}, tpl: { kinds: ['normal', 'normal', 'normal', 'normal', 'normal', 'normal', 'off'], u: 0 }, ap: { total: 0, w: [1, 2, 3], cats: {}, u: 0 } });
function load() {
  try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && x.v === 2) return Object.assign(blank(), x); } catch (e) {}
  const d = blank();
  // стартовые категории с постоянными id, чтобы на двух устройствах не появилось дублей
  d.cats['seed-en'] = { id: 'seed-en', name: 'Английский', color: 'c1', emoji: '🗣️', order: 1, u: 1 };
  d.cats['seed-cp'] = { id: 'seed-cp', name: 'CP', color: 'c2', emoji: '💻', order: 2, u: 1 };
  return d;
}
let D = load();
if (DEMO && !localStorage.getItem(KEY)) D = demoData();
function demoData() {
  const d = blank(), td = today(), ws = weekStart(td), u = 1000;
  const C = [['en', 'Английский', 'c1', '🗣️', 'min'], ['cp', 'CP', 'c2', '💻', 'min'], ['mat', 'Матан', 'c3', '🧮', 'min'], ['games', 'Игры', 'c4', '🎮', 'max']];
  C.forEach(([id, name, color, emoji, mode], i) => { d.cats[id] = { id, name, color, emoji, mode, order: i + 1, u }; });
  const log = (cat, day, min) => { const id = 'l-' + cat + '-' + day; d.logs[id] = { id, cat, day, sec: min * 60, u }; };
  // прошлые 6 недель: одни выполнены, другие нет — чтобы были история и серия
  const share = [0.7, 0.85, 0.6, 1.05, 1.1, 1.0];
  share.forEach((k, j) => {
    const w = addDays(ws, -7 * (6 - j)), plan = { en: 300, cp: 480, mat: 240, games: 300 };
    d.weeks[w] = { id: w, plan, reviewed: true, u };
    [['en', 300], ['cp', 480], ['mat', 240]].forEach(([c, m]) => [0, 1, 2, 3, 4].forEach(i => log(c, addDays(w, i), Math.round(m * k / 5))));
    log('games', addDays(w, 5), k > 1 ? 240 : 200);
  });
  // текущая неделя
  d.weeks[ws] = { id: ws, plan: { en: 420, cp: 600, mat: 300, games: 240 }, u };
  d.days[addDays(ws, 2)] = { id: addDays(ws, 2), kind: 'main', skip: false, u };
  d.days[addDays(ws, 3)] = { id: addDays(ws, 3), kind: 'normal', skip: true, u };
  const T = (id, title, cat, day, done, mins, logDay) => { d.tasks[id] = { id, title, cat, day, done: !!done, log: mins ? { [logDay || day]: mins * 60 } : {}, run: 0, created: u + Object.keys(d.tasks).length, u }; };
  const past = n => addDays(ws, n) < td;
  if (past(0)) { T('t1', 'Present Simple: правила', 'en', addDays(ws, 0), 1, 60); T('t2', 'MEX и XOR: 3 задачи', 'cp', addDays(ws, 0), 1, 90); }
  if (past(1)) { T('t3', 'Codeforces Div. 3, дорешка', 'cp', addDays(ws, 1), 1, 120); }
  if (past(2)) { T('t4', 'Past Simple: упражнения', 'en', addDays(ws, 2), 1, 90); T('t5', 'Бинпоиск по ответу', 'cp', addDays(ws, 2), 1, 120); T('t6', 'Пределы: ДЗ', 'mat', addDays(ws, 2), 1, 60); }
  if (past(3)) T('t7', 'Конспект по матану', 'mat', addDays(ws, 3), 0, 0);
  if (past(4)) { T('t8', 'Слушать подкаст', 'en', addDays(ws, 4), 1, 30); log('mat', addDays(ws, 4), 60); log('games', addDays(ws, 4), 180); }
  if (past(5)) { log('cp', addDays(ws, 5), 60); log('games', addDays(ws, 5), 120); }
  T('t9', 'Present Perfect: таблица', 'en', td, 0, 0);
  T('t10', 'Разобрать задачу с префиксными суммами', 'cp', td, 0, 0);
  d.recur.r1 = { id: 'r1', title: 'Слова, 20 штук', cat: 'en', days: [0, 2, 4], start: addDays(ws, -14), created: u, u };
  d.recur.r2 = { id: 'r2', title: 'Задача дня на Codeforces', cat: 'cp', days: [0, 1, 2, 3, 4, 5, 6], start: addDays(ws, -14), created: u, u };
  return d;
}
let S = Object.assign({ theme: 'system', token: '', gist: '', last: 0, lastCat: '' }, (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } })());
const saveS = () => localStorage.setItem(SKEY, JSON.stringify(S));

const touch = o => { o.u = Date.now(); return o; };
const live = c => Object.values(D[c]).filter(x => !x.del);
const cats = () => live('cats').sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
const catById = id => { const c = id && D.cats[id]; return c && !c.del ? c : null; };
const isMax = c => !!(c && c.mode === 'max');
const catColor = c => c ? c.color : 'low';
const safeImg = v => typeof v === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : '';
const catDot = (c, big) => `<span class="cdot${big ? ' big' : ''}" style="--cc:var(--${catColor(c)})" aria-hidden="true">${c && safeImg(c.img) ? `<img src="${c.img}" alt="">` : c ? (esc(c.emoji) || esc((c.name[0] || '?').toUpperCase())) : '·'}</span>`;
const catLabel = c => c ? (c.emoji && !safeImg(c.img) ? c.emoji + ' ' : '') + c.name : 'Без категории';
const firstGrapheme = v => { v = String(v || '').trim(); if (!v) return ''; try { if (Intl.Segmenter) return [...new Intl.Segmenter('ru', { granularity: 'grapheme' }).segment(v)][0].segment; } catch (e) {} return Array.from(v).slice(0, 2).join(''); };

function purge() {
  const lim = Date.now() - 90 * 864e5;
  for (const c of COLL) for (const [k, x] of Object.entries(D[c])) if (x.del && x.u < lim) delete D[c][k];
}
function save() {
  purge();
  try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('Не удалось сохранить: ' + e.message); }
  queueSync();
}
function merge(into, other) {
  let changed = false;
  for (const c of COLL) {
    if (!into[c]) into[c] = {};
    const a = into[c], b = (other && other[c]) || {};
    for (const [k, x] of Object.entries(b)) if (!a[k] || (x.u || 0) > (a[k].u || 0)) { a[k] = x; changed = true; }
  }
  for (const k of ['tpl', 'ap']) if (other && other[k] && (other[k].u || 0) > ((into[k] && into[k].u) || 0)) { into[k] = other[k]; changed = true; }
  return changed;
}

/* ---------- дни, недели, план ---------- */
const dayRec = s => { const r = D.days[s]; return r && !r.del ? r : null; };
const kindOf = s => (dayRec(s) && dayRec(s).kind) || D.tpl.kinds[wdIdx(s)] || 'normal';
const skipped = s => !!(dayRec(s) && dayRec(s).skip);
function setDay(s, patch, noSave) {
  D.days[s] = touch(Object.assign({ id: s, kind: kindOf(s), skip: skipped(s) }, dayRec(s) || {}, patch, { del: false }));
  if (!noSave) save();
}
const weekRec = ws => { const r = D.weeks[ws]; return r && !r.del ? r : null; };
const planOf = ws => (weekRec(ws) && weekRec(ws).plan) || {};
function setWeek(ws, patch, noSave) {
  D.weeks[ws] = touch(Object.assign({ id: ws, plan: {} }, weekRec(ws) || {}, patch, { del: false }));
  if (!noSave) save();
}
function setPlan(ws, cat, min) {
  const plan = { ...planOf(ws) };
  if (min > 0) plan[cat] = min; else delete plan[cat];
  setWeek(ws, { plan });
}
// сколько секунд положено каждой категории «не меньше» в каждый день недели.
// Пропущенный день свою долю сохраняет: она уходит в недобор, а не размазывается по другим дням.
function targets(ws) {
  const days = weekDays(ws), w = days.map(d => W[kindOf(d)] ?? 1), sum = w.reduce((a, b) => a + b, 0), plan = planOf(ws), out = {};
  days.forEach((d, i) => { out[d] = {}; for (const [c, m] of Object.entries(plan)) { const cat = catById(c); if (cat && !isMax(cat)) out[d][c] = sum ? m * 60 * w[i] / sum : 0; } });
  return out;
}

/* ---------- повторяющиеся задачи ---------- */
const recurOn = d => live('recur').filter(r => r.days.includes(wdIdx(d)) && d >= r.start && (!r.end || d <= r.end));
const virtualOf = (r, d) => ({ id: r.id + ':' + d, title: r.title, cat: r.cat, day: d, done: false, log: {}, run: 0, recur: r.id, created: r.created || 0, virtual: true });
function virtualById(id) {
  const i = id.lastIndexOf(':'); if (i < 0) return null;
  const r = D.recur[id.slice(0, i)], d = id.slice(i + 1);
  return r && !r.del ? virtualOf(r, d) : null;
}
const getTask = id => (id && (D.tasks[id] || virtualById(id))) || null;
function realize(t) { if (!t.virtual) return t; const x = { ...t }; delete x.virtual; D.tasks[x.id] = touch(x); return x; }
function dayTasks(d) {
  const real = live('tasks').filter(t => t.day === d);
  const virt = recurOn(d).filter(r => !D.tasks[r.id + ':' + d]).map(r => virtualOf(r, d));
  return real.concat(virt);

/* ---------- время ---------- */
// разрезает отрезок [start, end) по полуночам: {дата: секунды}
function spanByDay(start, end) {
  const out = {}; let a = start;
  while (a < end) {
    const d = new Date(a), next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime(), b = Math.min(end, next);
    out[iso(d)] = (out[iso(d)] || 0) + (b - a) / 1000; a = b;
  }
  return out;
}
const runningTask = () => live('tasks').find(t => t.run);
const taskSecOn = (t, day) => ((t.log && t.log[day]) || 0) + (t.run ? spanByDay(t.run, Date.now())[day] || 0 : 0);
const taskTotal = t => sumv(t.log || {}) + (t.run ? (Date.now() - t.run) / 1000 : 0);
function facts(days) { // {дата: {категория|'none': секунды}}
  const out = {}; days.forEach(d => { out[d] = {}; });
  const add = (cat, d, s) => { const c = catById(cat) ? cat : 'none'; if (out[d] && s > 0) out[d][c] = (out[d][c] || 0) + s; };
  for (const t of live('tasks')) {
    for (const [d, s] of Object.entries(t.log || {})) add(t.cat, d, s);
    if (t.run) for (const [d, s] of Object.entries(spanByDay(t.run, Date.now()))) add(t.cat, d, s);
  }
  for (const l of live('logs')) add(l.cat, l.day, l.sec);
  return out;
}
function stopTimer(t, end) {
  if (!t.run) return;
  end = Math.min(end || Date.now(), Date.now());
  const log = { ...(t.log || {}) };
  if (end > t.run) for (const [d, s] of Object.entries(spanByDay(t.run, end))) log[d] = Math.round((log[d] || 0) + s);
  t.log = log; t.run = 0; t.ack = 0; touch(t);
}
function toggleTimer(id) {
  let t = getTask(id); if (!t) return;
  t = realize(t);
  if (t.run) stopTimer(t);
  else { live('tasks').forEach(x => x.run && stopTimer(x)); t.run = Date.now(); t.ack = 0; touch(t); }
  save(); render();
}

/* ---------- итоги недели ---------- */
function weekStats(ws) {
  const days = weekDays(ws), td = today(), tg = targets(ws), f = facts(days), plan = planOf(ws);
  let p = 0, got = 0, def = 0, over = 0, hasPlan = false, fact = 0;
  days.forEach(d => { fact += sumv(f[d]); });
  for (const c of cats()) {
    const pm = (plan[c.id] || 0) * 60; if (!pm) continue;
    hasPlan = true;
    const fa = days.reduce((a, d) => a + (f[d][c.id] || 0), 0);
    if (isMax(c)) { if (fa > pm) over++; continue; }
    p += pm; got += Math.min(fa, pm);
    const due = days.filter(d => d < td).reduce((a, d) => a + (tg[d][c.id] || 0), 0);
    if (due > fa) def += due - fa;
  }
  const pct = p ? got / p : 0;
  return { days, tg, f, plan, hasPlan, p, got, def, over, fact, pct, success: p > 0 && pct >= 0.999 && !over };
}
function streak() {
  let s = 0, ws = weekStart(today());
  if (weekStats(ws).success) s++;
  ws = addDays(ws, -7);
  for (let i = 0; i < 104 && weekStats(ws).success; i++) { s++; ws = addDays(ws, -7); }
  return s;
}
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
// какую неделю пора подвести: в воскресенье — текущую, в остальные дни — прошлую
function reviewTarget() {
  const td = today(), ws = weekStart(td), T = wdIdx(td) === 6 ? ws : addDays(ws, -7);
  const r = weekRec(T);
  if (r && r.reviewed) return null;
  const has = Object.keys(planOf(T)).length || weekDays(T).some(d => sumv(facts([d])[d]) > 0);
  return has ? T : null;
}

/* ---------- Итоги недели и план на следующую ---------- */
function openReview(T) {
  const next = addDays(T, 7);
  const base = Object.keys(planOf(next)).length ? planOf(next) : planOf(T);
  const tasks = live('tasks').filter(t => t.day >= T && t.day <= addDays(T, 6) && !t.done && !t.recur);
  V.rv = { ws: T, plan: { ...base }, kinds: weekDays(next).map(kindOf), move: Object.fromEntries(tasks.map(t => [t.id, true])) };
  V.tab = 'review'; render(); window.scrollTo(0, 0);
}
function renderReview() {
  const R = V.rv, T = R.ws, next = addDays(T, 7), st = weekStats(T), td = today();
  const fa = id => st.days.reduce((a, d) => a + (st.f[d][id] || 0), 0);
  const moveTo = next > td ? next : td;
  const rows = cats().filter(c => st.plan[c.id] || fa(c.id)).map(c => {
    const p = (st.plan[c.id] || 0) * 60, v = fa(c.id);
    let res;
    if (isMax(c)) res = !p ? '' : v > p ? `<span class="bad">лимит +${hmm(v - p)}</span>` : '<span class="good">в лимите</span>';
    else res = !p ? '<span class="mute">вне плана</span>' : v >= p ? '<span class="good">✓ 100%</span>' : `<span class="bad">${Math.round(v / p * 100)}%</span>`;
    return `<div class="rvrow"><span class="pname">${catDot(c)}<span>${esc(c.name)}</span>${isMax(c) ? '<span class="tag">лимит</span>' : ''}</span><span class="n">${hmm(v)}${p ? ` <span class="mute">/ ${hmm(p)}</span>` : ''}</span><span class="n">${res}</span></div>`;
  }).join('');
  const tasks = live('tasks').filter(t => t.day >= T && t.day <= addDays(T, 6) && !t.done && !t.recur);
  const n = streak();
  const verdict = !st.p ? 'На этой неделе плана не было.'
    : st.success ? `✓ План недели выполнен${n ? ` · серия ${n} ${plural(n, 'неделя', 'недели', 'недель')}` : ''}`
    : `Сделано ${Math.round(st.pct * 100)}% плана${st.def > 60 ? `, недобор ${hmm(st.def)}` : ''}${st.over ? ', превышен лимит' : ''}`;

  return `
  <div class="head"><button class="icon" type="button" data-act="rvback" aria-label="Назад">‹</button><h1 class="grow">Итоги недели</h1></div>
  <p class="date">${fmtRange(T)}${st.days.filter(skipped).length ? ` · пропусков: ${st.days.filter(skipped).length}` : ''}</p>

  <section class="card">
    <h2>Как прошла неделя</h2>
    ${rows || '<p class="empty">Времени не записано.</p>'}
    <p class="verdict${st.success ? ' ok' : ''}">${verdict}</p>
  </section>

  ${tasks.length ? `<section class="card">
    <h2>Несделанные задачи</h2>
    <p class="mute sm">Отмеченные перенесутся на ${fmtLong(moveTo)}.</p>
    ${tasks.map(t => `<label class="chk-row"><input type="checkbox" data-rvmove="${t.id}"${R.move[t.id] ? ' checked' : ''}><span class="grow">${esc(t.title)}</span><span class="mute sm">${esc(catLabel(catById(t.cat)))}</span></label>`).join('')}
  </section>` : ''}

  <section class="card">
    <h2>План на ${fmtRange(next)}</h2>
    <p class="mute sm">Заполнено по ${Object.keys(planOf(next)).length ? 'уже заданному плану' : 'прошлой неделе'}. Поправь часы и дни.</p>
    <div class="row" style="margin:10px 0 4px"><button class="secondary" type="button" data-act="auto" data-for="rv">Заполнить автоматически</button></div>
    ${cats().map(c => `<div class="rvrow"><span class="pname">${catDot(c)}<span>${esc(c.name)}</span>${isMax(c) ? '<span class="tag">лимит</span>' : ''}</span>
      <span class="mute sm">было ${hmm(fa(c.id))}</span>
      <label class="hrs"><input type="text" inputmode="decimal" data-rvplan="${c.id}" value="${R.plan[c.id] ? hoursStr(R.plan[c.id]) : ''}" placeholder="0" aria-label="Часов на ${esc(c.name)}"><span class="mute sm">ч</span></label></div>`).join('')}
    <h3>Дни</h3>
    <p class="mute sm">Нажимай, чтобы переключать: обычный → главный → выходной.</p>
    <div class="tpl">${R.kinds.map((k, i) => `<button type="button" class="${k}" data-act="rvkind" data-i="${i}"><b>${WD[i]}</b>${k === 'main' ? '★' : k === 'off' ? 'вых' : parse(addDays(next, i)).getDate()}</button>`).join('')}</div>

}

/* ---------- CSV ---------- */
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const csvCell = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csv = rows => '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
function csvTime() {
  const rows = [];
  for (const t of live('tasks')) {
    const log = { ...(t.log || {}) };
    if (t.run) for (const [d, s] of Object.entries(spanByDay(t.run, Date.now()))) log[d] = (log[d] || 0) + s;
    for (const [d, s] of Object.entries(log)) if (s >= 30) rows.push([d, catById(t.cat) ? catById(t.cat).name : '', t.title, Math.round(s / 60), 'задача']);
  }
  for (const l of live('logs')) rows.push([l.day, catById(l.cat) ? catById(l.cat).name : '', l.from ? `${l.from}–${l.to}` : '', Math.round(l.sec / 60), 'вручную']);
  rows.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  download(`every-day-time-${today()}.csv`, csv([['Дата', 'Категория', 'Задача', 'Минуты', 'Источник'], ...rows]), 'text/csv;charset=utf-8');
}
function csvWeeks() {
  const dates = new Set();
  for (const t of live('tasks')) Object.keys(t.log || {}).forEach(d => dates.add(d));
  live('logs').forEach(l => dates.add(l.day));
  live('weeks').forEach(w => { if (Object.keys(w.plan || {}).length) dates.add(w.id); });
  const weeks = [...new Set([...dates].map(weekStart))].sort();
  const rows = [];
  for (const ws of weeks) {
    const st = weekStats(ws);
    for (const c of cats()) {
      const p = st.plan[c.id] || 0, fa = Math.round(st.days.reduce((a, d) => a + (st.f[d][c.id] || 0), 0) / 60);
      if (!p && !fa) continue;
      rows.push([ws, c.name, isMax(c) ? 'не больше' : 'не меньше', p, fa, p ? Math.round(fa / p * 100) : '']);
    }
  }

/* ---------- фото категории: обрезаем по центру до квадрата 96×96 и храним как data URL ---------- */
let photoFor = null;
$('#photoFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  const c = photoFor && D.cats[photoFor]; photoFor = null;
  if (!file || !c) return;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('не удалось открыть картинку')); i.src = url; });
    const N = 96, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const k = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - k) / 2, sy = (img.naturalHeight - k) / 2;
    cv.getContext('2d').drawImage(img, sx, sy, k, k, 0, 0, N, N);
    URL.revokeObjectURL(url);
    let data = cv.toDataURL('image/webp', 0.82);
    if (!data.startsWith('data:image/webp')) data = cv.toDataURL('image/jpeg', 0.85);
    c.img = data; touch(c); save(); render(); toast('Фото поставлено');

dlg.addEventListener('close', async () => {
  let t = dTask; dTask = null;
  if (!t) return;
  const rv = dlg.returnValue, r = t.recur && D.recur[t.recur] && !D.recur[t.recur].del ? D.recur[t.recur] : null;
  if (rv === 'del') {
    const x = t.virtual ? { ...t } : t; delete x.virtual;
    x.del = true; x.run = 0; D.tasks[x.id] = touch(x); save(); render();
    return toast('Удалено', () => { x.del = false; touch(x); save(); render(); });
  }
  if (rv === 'delall' && r) {
    if (!await ask(`Перестать повторять «${r.title}» с ${fmtShort(t.day)}? Прошлые дни останутся.`)) return;
    r.end = addDays(t.day, -1); if (r.end < r.start) r.del = true; touch(r);
    for (const x of live('tasks')) if (x.recur === r.id && x.day >= t.day && !x.done) { x.del = true; x.run = 0; touch(x); }
    save(); return render();
  }
  if (rv !== 'save') return;
  t = realize(t);
  t.title = dform.title.value.trim() || t.title;
  t.cat = dform.cat.value || '';
  if (dform.day.value) t.day = dform.day.value;
  const m = parseInt(dform.min.value, 10) || 0;
  if (m !== dMin0 && m >= 0) { t.log = { ...(t.log || {}) }; if (m) t.log[V.day] = m * 60; else delete t.log[V.day]; }
  touch(t);
  if (r) {
    if (dDays.length) { r.title = t.title; r.cat = t.cat; r.days = dDays.slice(); touch(r); }
    else { r.end = addDays(t.day, -1); if (r.end < r.start) r.del = true; touch(r); t.recur = null; } // дни сняты — повтор заканчивается
  } else if (dDays.length) {
    // обычная задача становится повторяющейся: этот экземпляр получает id шаблона, чтобы не было дубля
    const nr = touch({ id: uid(), title: t.title, cat: t.cat, days: dDays.slice(), start: t.day, created: t.created || Date.now() });
    D.recur[nr.id] = nr;
    if (dDays.includes(wdIdx(t.day))) { const nt = { ...t, id: nr.id + ':' + t.day, recur: nr.id }; D.tasks[nt.id] = touch(nt); t.del = true; t.run = 0; touch(t); }
  }
  save(); render();
});

/* ---------- окно «добавить время» ---------- */
const tdlg = $('#tdlg'), tform = $('#tForm');
function openTime() {
  const ts = dayTasks(V.day).filter(t => !t.done || taskSecOn(t, V.day));
  tform.target.innerHTML = `<optgroup label="Категория">${cats().map(c => `<option value="c:${c.id}">${esc(catLabel(c))}</option>`).join('')}<option value="c:">Без категории</option></optgroup>`
    + (ts.length ? `<optgroup label="Задача этого дня">${ts.map(t => `<option value="t:${esc(t.id)}">${esc(t.title)}</option>`).join('')}</optgroup>` : '');
  tform.day.value = V.day; tform.from.value = ''; tform.to.value = ''; tform.min.value = '';
  tdlg.showModal();
}
tdlg.addEventListener('close', () => {
  if (tdlg.returnValue !== 'save') return;
  const day = tform.day.value || V.day, from = tform.from.value, to = tform.to.value;
  let sec = 0, extra = {};
  if (from && to) {
    const a = +from.slice(0, 2) * 60 + +from.slice(3), b = +to.slice(0, 2) * 60 + +to.slice(3);
    sec = ((b - a + 1440) % 1440) * 60; extra = { from, to };
  } else sec = (parseInt(tform.min.value, 10) || 0) * 60;
  if (sec <= 0) return toast('Укажи время: «с — по» или минуты');
  const v = tform.target.value;
  if (v.startsWith('t:')) {
    const t = realize(getTask(v.slice(2))); if (!t) return;
    t.log = { ...(t.log || {}) }; t.log[day] = (t.log[day] || 0) + sec; touch(t); save(); render();
    return toast(`${t.title}: +${hm(sec)}`);
  }
  addLog(v.slice(2), day, sec, extra);
});

/* ---------- забытый таймер ---------- */
const gdlg = $('#gdlg'), gform = $('#gForm');
let gTask = null;
function checkGuard() {
  const t = runningTask();
  if (!t || dlg.open || tdlg.open || gdlg.open) return;
  if (Date.now() - Math.max(t.run, t.ack || 0) < GUARD_MS) return;
  gTask = t;
  $('#gText').textContent = `«${t.title}» идёт уже ${hm((Date.now() - t.run) / 1000)}, с ${new Date(t.run).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}. Если забыл остановить, укажи, когда закончил.`;
  gform.end.min = localDT(t.run); gform.end.max = localDT(Date.now());
  gform.end.value = localDT(Math.min(Date.now(), t.run + 3600e3));
  gdlg.showModal();
}
gdlg.addEventListener('close', () => {
  const t = gTask; gTask = null;
  if (!t || !t.run) return;
  const rv = gdlg.returnValue;
  if (rv === 'cut') {
    const end = new Date(gform.end.value).getTime();
    if (!isFinite(end) || end <= t.run) { toast('Время конца должно быть позже начала'); return checkGuard(); }
    stopTimer(t, end);
  } else if (rv === 'now') stopTimer(t);
  else { t.ack = Date.now(); touch(t); }
  save(); render();
});

/* ---------- автоплан ----------
   У каждой категории «не меньше» свой способ получить часы:
   p   — приоритет 1/2/3, делит остаток по весам (по умолчанию 1 : 2 : 3)
   pct — своя доля в процентах от того, что осталось после «ровно»
   fix — ровно столько часов
   off — без часов
   Сначала вычитаются «ровно», затем проценты, остаток делится по приоритетам. */
const adlg = $('#adlg'), aform = $('#aForm');
let AP = null;
const apCfg = id => (D.ap.cats && D.ap.cats[id]) || { t: 'p', v: 2 };
function openAuto(kind) {
  const ws = kind === 'rv' ? addDays(V.rv.ws, 7) : V.week;
  const base = kind === 'rv' ? { ...V.rv.plan } : { ...planOf(ws) };
  const src = kind === 'rv' ? V.rv.ws : addDays(ws, -7), st = weekStats(src);
  const debt = {};
  for (const c of cats()) {
    if (isMax(c) || !st.plan[c.id]) continue;
    const fa = st.days.reduce((a, d) => a + (st.f[d][c.id] || 0), 0), gap = st.plan[c.id] - fa / 60;
    if (gap >= 15) debt[c.id] = gap;
  }
  const mins = cats().filter(c => !isMax(c)), sumBase = mins.reduce((a, c) => a + (base[c.id] || 0), 0);
  AP = { kind, ws, base, debt, cfg: Object.fromEntries(mins.map(c => [c.id, { ...apCfg(c.id) }])) };
  const total = D.ap.total || Math.round(sumBase / 60) || 20;
  aform.total.value = Math.min(80, total); aform.totalN.value = hoursStr(total * 60);
  const w = D.ap.w || [1, 2, 3];
  aform.w1.value = String(w[0]).replace('.', ','); aform.w2.value = String(w[1]).replace('.', ','); aform.w3.value = String(w[2]).replace('.', ',');
  $('#aFor').textContent = 'План на ' + fmtRange(ws) + '. Можно выбрать приоритет, свою долю в процентах или точное число часов.';
  const dsum = sumv(debt);
  $('#aDebtRow').hidden = !dsum; aform.debt.checked = false;
  $('#aDebtLbl').textContent = `Добавить недобор недели ${fmtRange(src)} (+${hmm(dsum * 60)})`;
  const opt = (v, n, cur) => `<option value="${v}"${cur === v ? ' selected' : ''}>${n}</option>`;
  $('#aRows').innerHTML = mins.map(c => {
    const g = AP.cfg[c.id], sel = g.t === 'p' ? 'p' + g.v : g.t;
    return `<div class="aprow" data-c="${c.id}" style="--cc:var(--${c.color})">
      <div class="pname">${catDot(c)}<span>${esc(c.name)}</span></div>
      <b class="ares">0:00</b>
      <div class="ctl">
        <select data-ap="t" aria-label="Как считать часы для ${esc(c.name)}">${opt('p1', 'Низкий приоритет', sel)}${opt('p2', 'Средний приоритет', sel)}${opt('p3', 'Высокий приоритет', sel)}${opt('pct', 'Своя доля, %', sel)}${opt('fix', 'Ровно, часов', sel)}${opt('off', 'Без часов', sel)}</select>
        <span class="aval"${g.t === 'pct' || g.t === 'fix' ? '' : ' hidden'}><input type="text" inputmode="decimal" data-ap="v" value="${g.t === 'fix' ? hoursStr(g.v) : g.t === 'pct' ? g.v : ''}" aria-label="Значение для ${esc(c.name)}"><span class="mute sm">${g.t === 'fix' ? 'ч' : '%'}</span></span>
      </div>
      <div class="pbar"><i style="width:0"></i></div>
    </div>`;
  }).join('') + cats().filter(isMax).map(c => `<div class="aprow" style="--cc:var(--${c.color})"><div class="pname">${catDot(c)}<span>${esc(c.name)}</span></div><span class="mute sm">лимит ${hmm((base[c.id] || 0) * 60)}, не делится</span></div>`).join('');
  calcAuto();
  adlg.showModal();
}
function readAuto() {
  const total = parseHours(aform.totalN.value);
  const w = [aform.w1, aform.w2, aform.w3].map(x => { const v = parseHours(x.value); return isFinite(v) && v >= 0 ? v : 0; });
  return { total: isFinite(total) && total > 0 ? Math.min(total, 168) : 0, w };
}
function calcAuto() {
  const { total, w } = readAuto(), T = total * 60, cfg = AP.cfg, res = {}, warn = [];
  const ids = Object.keys(cfg);
  const fixSum = ids.filter(i => cfg[i].t === 'fix').reduce((a, i) => a + (cfg[i].v || 0), 0);
  if (fixSum > T) warn.push(`«Ровно» в сумме ${hmm(fixSum * 60)} — больше, чем всего часов.`);
  const rem = Math.max(0, T - fixSum);
  const pctIds = ids.filter(i => cfg[i].t === 'pct'), pctSum = pctIds.reduce((a, i) => a + (cfg[i].v || 0), 0);
  if (pctSum > 100) warn.push(`Доли в процентах дают ${Math.round(pctSum)}%. Поделил их пропорционально.`);
  const pctPart = rem * Math.min(pctSum, 100) / 100;
  const pIds = ids.filter(i => cfg[i].t === 'p'), wSum = pIds.reduce((a, i) => a + (w[cfg[i].v - 1] || 0), 0);
  const pool = rem - pctPart;
  const raw = {};
  for (const i of ids) {
    const g = cfg[i];
    let m = g.t === 'fix' ? g.v || 0 : g.t === 'pct' ? (pctSum ? pctPart * (g.v || 0) / pctSum : 0) : g.t === 'p' ? (wSum ? pool * (w[g.v - 1] || 0) / wSum : 0) : 0;
    if (aform.debt.checked && AP.debt[i] && g.t !== 'off') m += AP.debt[i];
    raw[i] = m;
  }
  // округляем до 15 минут так, чтобы сумма не «уезжала»: остаток отдаём тем, у кого дробная часть больше
  const goal = Math.round(sumv(raw) / 15) * 15;
  for (const i of ids) res[i] = Math.floor(raw[i] / 15) * 15;
  let extra = Math.round((goal - sumv(res)) / 15);
  for (const i of ids.slice().sort((x, y) => (raw[y] - res[y]) - (raw[x] - res[x]))) { if (extra <= 0) break; if (raw[i] - res[i] > 0) { res[i] += 15; extra--; } }
  const left = pIds.length && wSum ? 0 : pool;
  const mx = Math.max(1, ...Object.values(res));
  document.querySelectorAll('#aRows .aprow[data-c]').forEach(row => {
    const m = res[row.dataset.c] || 0;
    row.querySelector('.ares').textContent = hmm(m * 60);
    row.querySelector('.pbar i').style.width = (m / mx * 100) + '%';
  });
  const sum = sumv(res);
  $('#aSum').innerHTML = `Итого: <b>${hmm(sum * 60)}</b>`;
  $('#aLeft').textContent = left >= 15 ? `не распределено ${hmm(left * 60)}` : '';
  $('#aWarn').hidden = !warn.length; $('#aWarn').textContent = warn.join(' ');
  AP.res = res;
  return res;
}
aform.addEventListener('input', e => {
  const el = e.target, row = el.closest('.aprow');
  if (el.name === 'total') aform.totalN.value = el.value;
  if (el.name === 'totalN') { const v = parseHours(el.value); if (isFinite(v)) aform.total.value = Math.min(80, Math.max(1, Math.round(v))); }
  if (row && el.dataset.ap === 't') {
    const g = AP.cfg[row.dataset.c], v = el.value, box = row.querySelector('.aval'), inp = box.querySelector('input');
    if (v[0] === 'p' && v !== 'pct') { g.t = 'p'; g.v = +v[1]; box.hidden = true; }
    else {
      g.t = v; box.hidden = v === 'off';
      if (v === 'fix') { g.v = AP.res[row.dataset.c] || 60; inp.value = hoursStr(g.v); box.querySelector('span').textContent = 'ч'; }
      if (v === 'pct') { const t = readAuto().total * 60; g.v = t ? Math.round((AP.res[row.dataset.c] || 0) / t * 100) : 0; inp.value = g.v; box.querySelector('span').textContent = '%'; }
    }
  }
  if (row && el.dataset.ap === 'v') {
    const g = AP.cfg[row.dataset.c], x = parseHours(el.value);
    g.v = !isFinite(x) || x < 0 ? 0 : g.t === 'fix' ? Math.round(Math.min(x, 168) * 60) : Math.min(x, 100);
  }
  calcAuto();
});
aform.addEventListener('change', e => { if (e.target.name === 'debt') calcAuto(); });
adlg.addEventListener('close', () => {
  if (adlg.returnValue !== 'apply' || !AP) return;
  const res = calcAuto(), plan = { ...AP.base };
  for (const [id, m] of Object.entries(res)) { if (m > 0) plan[id] = m; else delete plan[id]; }
  const { total, w } = readAuto();
  D.ap = touch({ total, w, cats: { ...(D.ap.cats || {}), ...clone(AP.cfg) } });
  if (AP.kind === 'rv' && V.rv) { V.rv.plan = plan; save(); }
  else setWeek(AP.ws, { plan });
  AP = null; render(); toast('План заполнен');
});

/* ================= синхронизация через GitHub Gist ================= */
let syncState = 'off', syncMsg = '', syncTimer = 0, syncing = false, again = false;
function setSync(st, msg) { syncState = st; syncMsg = msg || ''; renderTop(); const el = $('#syncStatus'); if (el) el.textContent = syncText(); }
function queueSync() { if (!S.token || DEMO) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 2500); }
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, {
    ...opt, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + S.token, Accept: 'application/vnd.github+json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) }
  });
  if (!r.ok) {
    const e = new Error(r.status === 401 ? 'GitHub не принял токен (401). Проверь, что он скопирован целиком и не истёк.'
      : r.status === 403 || r.status === 404 && !path.startsWith('/gists/') ? 'Нет доступа (' + r.status + '). Токену нужно право Gists: Read and write.'
      : 'GitHub ответил ' + r.status);
    e.status = r.status; throw e;
  }
  return r.json();
}
async function readGist(g) {
  const f = g && g.files && g.files[FILE]; if (!f) return null;
  const txt = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
  const x = JSON.parse(txt); return x && x.v === 2 ? x : null;
}
async function sync() {
  if (!S.token || DEMO) return;
  if (syncing) { again = true; return; }
  if (!navigator.onLine) return setSync('err', 'нет интернета');
  syncing = true; setSync('busy');
  try {
    let g = null;
    if (S.gist) { try { g = await gh('/gists/' + S.gist); } catch (e) { if (e.status === 404) { S.gist = ''; saveS(); } else throw e; } }
    if (!S.gist) { // ищем уже созданный gist (например, на другом устройстве)
      const list = await gh('/gists?per_page=100');
      const hit = list.find(x => x.files && x.files[FILE]);
      if (hit) { g = await gh('/gists/' + hit.id); S.gist = hit.id; saveS(); }
    }
    const remote = await readGist(g);
    const before = JSON.stringify(D);
    if (remote) merge(D, remote);
    if (JSON.stringify(D) !== before) {
      localStorage.setItem(KEY, JSON.stringify(D));
      if (!isEditing()) render();
    }
    const needPush = !remote || merge(clone(remote), D);
    if (needPush) {
      const files = { [FILE]: { content: JSON.stringify(D) } };
      if (S.gist) await gh('/gists/' + S.gist, { method: 'PATCH', body: JSON.stringify({ files }) });
      else { const ng = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Every Day — данные приложения', public: false, files }) }); S.gist = ng.id; }
    }
    S.last = Date.now(); saveS(); setSync('ok');
    if (V.tab === 'set' && !isEditing()) render();
  } catch (e) {
    setSync('err', e.message || String(e));
  } finally {
    syncing = false;
    if (again) { again = false; queueSync(); }
  }
}

/* ================= запуск ================= */
const isEditing = () => tourI >= 0 || $('#cdlg').open || dlg.open || tdlg.open || gdlg.open || adlg.open || V.tab === 'review' || (document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName));
let tick = 0;
setInterval(() => {
  document.querySelectorAll('[data-live]').forEach(el => { const t = getTask(el.dataset.live); if (t) el.textContent = clock(taskSecOn(t, el.dataset.day)); });
  const r = runningTask(), rt = $('#runTime');
  if (r && rt) rt.textContent = clock((Date.now() - r.run) / 1000);
  updateTitle();
  tick++;
  if (r && tick % 30 === 0 && !isEditing()) render(); // раз в 30 с обновляем полоски плана
  if (r && tick % 600 === 0) checkGuard();
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const fresh = (() => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } })();
  if (fresh && fresh.v === 2) merge(D, fresh); // если правили в другой вкладке
  if (V.followToday) V.day = today();
  if (!isEditing()) render();
  checkGuard();
  sync();
});
window.addEventListener('online', () => sync());
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 120000);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

$('#demoTag').hidden = !DEMO;
applyTheme();
if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(D));
render();
if (!S.tourDone) startTour(); else checkGuard();
sync();
})();
</script>
